[package]
name = "bitmap_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
parking_lot = "0.13.0"
rayon = "1.12.0"
roaring = "0.12.0"
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
tantivy = "0.27.0"
tiny_http = "0.12.0"
ureq = { version = "2", features = ["json"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
